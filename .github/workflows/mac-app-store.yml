name: Mac App Store

# Runs in this PUBLIC repository because GitHub Actions minutes (macOS included) are free and
# unlimited for public repos. The app's source stays in the private repository
# sosayessicaSE/cultiva: this job checks it out with SOURCE_TOKEN (fine-grained token,
# Contents: read-only on cultiva only). Nothing built here is published in this repo; the .pkg
# goes straight to App Store Connect. Logs are public, so no step prints secrets or source.
# Manual only: Actions > Mac App Store > Run workflow. See docs/mac-app-store.md in cultiva.
#
# Secrets in THIS repository (Settings > Secrets and variables > Actions):
#   SOURCE_TOKEN                     read access to sosayessicaSE/cultiva
#   MAS_APP_CERT_P12_BASE64          Mac App Distribution certificate + key (.p12, base64)
#   MAS_INSTALLER_CERT_P12_BASE64    Mac Installer Distribution certificate + key (.p12, base64)
#   MAS_CERT_PASSWORD                password of both .p12 files
#   MAS_PROVISIONING_PROFILE_BASE64  "Mac App Store Connect" profile for app.cultiva.desktop (base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (same values as in cultiva)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of sosayessicaSE/cultiva to build
        type: string
        default: main
      upload:
        description: Upload the build to App Store Connect
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mas:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://lebhxnqrhlcjeeclhcvs.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlYmh4bnFyaGxjamVlY2xoY3ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMjQwNTQsImV4cCI6MjEwOTkwMDA1NH0.y0nLYMuT31swW0-DHKQ4VYA9w9ednWkpX4_aUvy6Eik' }}
      VITE_WEB_URL: ${{ vars.VITE_WEB_URL || 'https://app.getcultiva.com' }}
      MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
      # electron-builder imports these into a temporary keychain.
      CSC_LINK: ${{ secrets.MAS_APP_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
    steps:
      - name: Check secrets
        run: |
          missing=()
          for name in SOURCE_TOKEN MAS_PROVISIONING_PROFILE_BASE64 CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Mac App Store secrets missing::Missing: ${missing[*]} (CSC_* = MAS_*_CERT_* secrets). See docs/mac-app-store.md in cultiva."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: sosayessicaSE/cultiva
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secrets pasted from `base64` output can carry line breaks, which makes electron-builder read
      # CSC_LINK as a file path. Decode everything to files first and point CSC_* at those files.
      - name: Write the certificates and provisioning profile
        run: |
          decode() { printf '%s' "$1" | tr -d ' \r\n' | base64 --decode > "$2"; }
          decode "$CSC_LINK" "$RUNNER_TEMP/mas-app.p12"
          decode "$CSC_INSTALLER_LINK" "$RUNNER_TEMP/mas-installer.p12"
          echo "CSC_LINK=$RUNNER_TEMP/mas-app.p12" >> "$GITHUB_ENV"
          echo "CSC_INSTALLER_LINK=$RUNNER_TEMP/mas-installer.p12" >> "$GITHUB_ENV"
          # Size and SHA-256 prefix only (safe to log): compare with the local .p12 files.
          for f in mas-app mas-installer; do
            echo "$f.p12: $(wc -c < "$RUNNER_TEMP/$f.p12" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$RUNNER_TEMP/$f.p12" | cut -c1-16), $(head -c 2 "$RUNNER_TEMP/$f.p12" | xxd -p)"
            if [ "$(wc -c < "$RUNNER_TEMP/$f.p12")" -lt 1500 ]; then
              echo "::error title=Certificate secret cut short::$f.p12 decoded to only a few bytes. Paste the whole one-line base64 value into the secret again."
              exit 1
            fi
          done
          mkdir -p apps/desktop/mas
          decode "$MAS_PROVISIONING_PROFILE_BASE64" apps/desktop/mas/embedded.provisionprofile
          security cms -D -i apps/desktop/mas/embedded.provisionprofile | plutil -extract Name raw -o - - || true

      # CFBundleVersion has to grow with every upload, so it is this repo's run number; the visible
      # version (CFBundleShortVersionString) stays apps/desktop/package.json's version.
      - name: Build the App Store package
        working-directory: apps/desktop
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac mas --universal --publish never "-c.buildVersion=${GITHUB_RUN_NUMBER}"
          ls -la release release/mas-universal || true

      - name: Check signature and sandbox
        working-directory: apps/desktop/release
        run: |
          pkg="$(ls ./*.pkg | head -1)"
          echo "PKG=$PWD/$pkg" >> "$GITHUB_ENV"
          pkgutil --check-signature "$pkg"
          app="mas-universal/Cultiva.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | tee entitlements.plist
          grep -q "com.apple.security.app-sandbox" entitlements.plist
          lipo -archs "$app/Contents/MacOS/cultiva"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist"

      - name: Validate and upload to App Store Connect
        if: inputs.upload
        run: |
          auth=(--username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --asc-provider "$APPLE_TEAM_ID")
          xcrun altool --validate-app --type macos --file "$PKG" "${auth[@]}"
          xcrun altool --upload-app --type macos --file "$PKG" "${auth[@]}"
          echo "Uploaded build ${GITHUB_RUN_NUMBER}. It appears in App Store Connect > Cultiva > TestFlight after processing." >> "$GITHUB_STEP_SUMMARY"
